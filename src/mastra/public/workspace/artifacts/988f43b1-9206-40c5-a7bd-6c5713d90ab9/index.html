<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake</title>
  <style>
    :root {
      --bg: #0f1220;
      --panel: #171a2b;
      --text: #e9ecff;
      --muted: #a7afd1;
      --accent: #6ee7b7;
      --danger: #fb7185;
      --grid: #232844;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1a1f36 0%, var(--bg) 45%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
    }

    .app {
      width: min(92vw, 520px);
      background: linear-gradient(180deg, #1b2040 0%, var(--panel) 100%);
      border: 1px solid #2b3155;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .stats {
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .pill {
      background: #11142a;
      border: 1px solid #2a3157;
      border-radius: 999px;
      padding: 6px 10px;
      color: var(--text);
      font-weight: 600;
    }

    .game-wrap {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2a3157;
      background: #0f1329;
    }

    canvas {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: block;
      image-rendering: pixelated;
      background:
        linear-gradient(0deg, transparent 24px, var(--grid) 25px),
        linear-gradient(90deg, transparent 24px, var(--grid) 25px),
        #0f1329;
      background-size: 25px 25px;
      background-position: center;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(7, 9, 20, 0.75);
      backdrop-filter: blur(2px);
      text-align: center;
      padding: 20px;
      transition: opacity 180ms ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 1.4rem;
    }

    .card p {
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.4;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      color: #0b1324;
      background: var(--accent);
      transition: transform 120ms ease, filter 120ms ease;
    }

    .btn:hover { filter: brightness(1.05); }
    .btn:active { transform: scale(0.98); }

    .controls {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .mobile-controls {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      user-select: none;
      touch-action: manipulation;
    }

    .mobile-controls button {
      background: #0f1533;
      border: 1px solid #2a3157;
      color: var(--text);
      border-radius: 10px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .mobile-controls .empty {
      visibility: hidden;
    }

    .footer {
      margin-top: 8px;
      font-size: 0.8rem;
      color: #8891bc;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="top">
      <div class="title">🐍 Snake</div>
      <div class="stats">
        <span class="pill">Score: <span id="score">0</span></span>
        <span class="pill">Best: <span id="best">0</span></span>
      </div>
    </div>

    <div class="game-wrap">
      <canvas id="game" width="500" height="500" aria-label="Snake game board"></canvas>
      <div id="overlay" class="overlay">
        <div class="card">
          <h2 id="overlay-title">Ready?</h2>
          <p id="overlay-text">Use arrow keys or WASD to move. Eat food, avoid walls and yourself.</p>
          <button id="start-btn" class="btn">Start Game</button>
        </div>
      </div>
    </div>

    <div class="mobile-controls" aria-label="Mobile controls">
      <span class="empty"></span>
      <button data-dir="up">↑</button>
      <span class="empty"></span>
      <button data-dir="left">←</button>
      <button data-dir="down">↓</button>
      <button data-dir="right">→</button>
    </div>

    <div class="controls">
      Controls: <strong>Arrow keys</strong> or <strong>WASD</strong> • Press <strong>Space</strong> to pause/resume.
    </div>
    <div class="footer">Tip: the snake speeds up as your score increases.</div>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const overlayText = document.getElementById('overlay-text');
      const startBtn = document.getElementById('start-btn');

      const GRID = 20;
      const SIZE = canvas.width / GRID;
      const KEY = 'snake-best-score';

      let snake;
      let dir;
      let nextDir;
      let food;
      let score;
      let best = Number(localStorage.getItem(KEY) || 0);
      let running = false;
      let paused = false;
      let timer = null;

      bestEl.textContent = best;

      function resetGame() {
        snake = [
          { x: 10, y: 10 },
          { x: 9, y: 10 },
          { x: 8, y: 10 }
        ];
        dir = { x: 1, y: 0 };
        nextDir = { ...dir };
        score = 0;
        paused = false;
        spawnFood();
        updateScore();
      }

      function spawnFood() {
        do {
          food = {
            x: Math.floor(Math.random() * GRID),
            y: Math.floor(Math.random() * GRID)
          };
        } while (snake.some(s => s.x === food.x && s.y === food.y));
      }

      function updateScore() {
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          localStorage.setItem(KEY, String(best));
          bestEl.textContent = best;
        }
      }

      function speedMs() {
        return Math.max(70, 130 - score * 2);
      }

      function startLoop() {
        if (timer) clearInterval(timer);
        timer = setInterval(tick, speedMs());
      }

      function setDirection(x, y) {
        if (!running) return;
        if (x === -dir.x && y === -dir.y) return;
        nextDir = { x, y };
      }

      function tick() {
        if (!running || paused) return;

        dir = nextDir;
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

        // wall collision
        if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
          gameOver();
          return;
        }

        // self collision
        if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
          gameOver();
          return;
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
          score += 1;
          updateScore();
          spawnFood();
          startLoop(); // speed up gradually
        } else {
          snake.pop();
        }

        draw();
      }

      function drawCell(x, y, color, radius = 4) {
        const px = x * SIZE;
        const py = y * SIZE;
        ctx.fillStyle = color;
        roundRect(ctx, px + 1, py + 1, SIZE - 2, SIZE - 2, radius);
        ctx.fill();
      }

      function roundRect(ctx, x, y, w, h, r) {
        const rr = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.arcTo(x + w, y, x + w, y + h, rr);
        ctx.arcTo(x + w, y + h, x, y + h, rr);
        ctx.arcTo(x, y + h, x, y, rr);
        ctx.arcTo(x, y, x + w, y, rr);
        ctx.closePath();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // food
        drawCell(food.x, food.y, '#fb7185', 8);

        // snake
        snake.forEach((seg, i) => {
          const color = i === 0 ? '#6ee7b7' : '#34d399';
          drawCell(seg.x, seg.y, color, i === 0 ? 8 : 5);
        });

        // eyes on head
        const head = snake[0];
        ctx.fillStyle = '#0b1324';
        const cx = head.x * SIZE + SIZE / 2;
        const cy = head.y * SIZE + SIZE / 2;
        const eyeOffsetX = dir.x !== 0 ? 4 : 6;
        const eyeOffsetY = dir.y !== 0 ? 4 : 6;
        ctx.beginPath();
        ctx.arc(cx - eyeOffsetX, cy - eyeOffsetY, 2, 0, Math.PI * 2);
        ctx.arc(cx + eyeOffsetX, cy + eyeOffsetY, 2, 0, Math.PI * 2);
        ctx.fill();
      }

      function showOverlay(title, text, buttonText = 'Start Game') {
        overlayTitle.textContent = title;
        overlayText.textContent = text;
        startBtn.textContent = buttonText;
        overlay.classList.remove('hidden');
      }

      function hideOverlay() {
        overlay.classList.add('hidden');
      }

      function startGame() {
        resetGame();
        running = true;
        hideOverlay();
        draw();
        startLoop();
      }

      function gameOver() {
        running = false;
        clearInterval(timer);
        showOverlay('Game Over', `Final score: ${score}. Try again?`, 'Restart');
      }

      function togglePause() {
        if (!running) return;
        paused = !paused;
        if (paused) {
          showOverlay('Paused', 'Press Space or click Resume to continue.', 'Resume');
        } else {
          hideOverlay();
        }
      }

      window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' ', 'w', 'a', 's', 'd'].includes(key)) {
          e.preventDefault();
        }

        if (key === 'arrowup' || key === 'w') setDirection(0, -1);
        else if (key === 'arrowdown' || key === 's') setDirection(0, 1);
        else if (key === 'arrowleft' || key === 'a') setDirection(-1, 0);
        else if (key === 'arrowright' || key === 'd') setDirection(1, 0);
        else if (key === ' ') {
          if (!running) startGame();
          else togglePause();
        }
      });

      document.querySelectorAll('.mobile-controls button[data-dir]').forEach(btn => {
        btn.addEventListener('click', () => {
          const d = btn.dataset.dir;
          if (!running) return;
          if (d === 'up') setDirection(0, -1);
          if (d === 'down') setDirection(0, 1);
          if (d === 'left') setDirection(-1, 0);
          if (d === 'right') setDirection(1, 0);
        });
      });

      startBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();

        // Always start/restart when the button is clicked.
        startGame();
      });

      // initial paint
      resetGame();
      draw();
      showOverlay('Ready?', 'Use arrow keys or WASD to move. Eat food, avoid walls and yourself.', 'Start Game');
    })();
  </script>
</body>
</html>
